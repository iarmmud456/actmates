()=>{const N=P([24,30,36,40,42,45,48,50,56,60,63,70,72,90]);return{t:`¿Cuál es el mayor divisor de ${N} que es menor que ${N}?`,a:N/Math.min(...Object.keys(facOf(N)).map(Number)),hh:'Los divisores van por parejas: si d divide al número, también lo divide el cociente. Piensa en el divisor más pequeño distinto de 1 y en su pareja.'}},
()=>{const N=P([12,18,20,24,28,30,36]);return{t:`¿Cuánto suman todos los divisores de ${N}?`,a:divsOf(N).reduce((x,y)=>x+y,0),hh:'Escribe todos los divisores (incluidos el 1 y el propio número) y súmalos. Compruébalos por parejas para no olvidar ninguno.'}},
()=>{const d=P([2,3,5,9]),L=Array.from({length:6},()=>R(100,999));return{t:`¿Cuántos de estos números son divisibles por ${d}? ${L.join(' ; ')}`,a:L.filter(x=>x%d==0).length,hh:DH[d]+' Aplícalo a cada número.'}},
()=>{let a,b;do{a=R(1,9);b=R(1,9)}while((a+b)%9==0);return{t:`¿Qué cifra hay que escribir en lugar de ? para que el número ${a}?${b} sea divisible por 9?`,a:(9-(a+b)%9)%9,hh:'Un número es divisible por 9 si la suma de sus cifras es múltiplo de 9. ¿Cuánto falta para llegar al siguiente múltiplo de 9?'}},
()=>{const a=R(3,12),q=R(5,15);return{t:`Sabemos que ${a*q} es múltiplo de ${a}. ¿Por qué número hay que multiplicar ${a} para obtener ${a*q}?`,a:q,hh:'Si un número es múltiplo de otro, sale de multiplicarlo por un número natural. Para averiguarlo, haz la operación inversa.'}}]},
{n:'MCD y MCM',e:'🔗',tip:'El m.c.d. de dos números es el mayor número que divide a los dos. El m.c.m. es el menor múltiplo común distinto de cero. Con la descomposición en factores primos: el m.c.d. se forma con los factores comunes elevados al menor exponente; el m.c.m., con los comunes y no comunes elevados al mayor exponente. Se cumple a · b = m.c.d. · m.c.m. Dos números son primos entre sí si su m.c.d. es 1.',T:[
()=>{const g=R(2,12),x=R(2,9),y=R(2,9);return{t:`Calcula el m.c.d. de ${g*x} y ${g*y}.`,a:gcdN(g*x,g*y),hh:'El m.c.d. es el mayor número que divide a los dos. Escribe los divisores de cada uno y busca el mayor que tengan en común, o usa la descomposición en factores primos.'}},
()=>{const a=R(4,15),b=a+R(1,8);return{t:`Calcula el m.c.m. de ${a} y ${b}.`,a:lcmN(a,b),hh:'El m.c.m. es el menor múltiplo común distinto de cero. Escribe los primeros múltiplos de cada uno hasta encontrar el primero que se repite.'}},
()=>{const p=P([[12,18],[16,24],[18,30],[20,30],[24,36],[28,42],[30,45]]);return{t:`En el diagrama están los divisores de ${p[0]} y de ${p[1]}. Según el diagrama, ¿cuál es el máximo común divisor?`,a:gcdN(p[0],p[1]),g:venn(p[0],p[1]),alt:'Diagrama de los divisores de '+p[0]+' y de '+p[1]+'. Divisores comunes: '+divsOf(p[0]).filter(x=>p[1]%x==0).join(', '),hh:'Los divisores comunes están en la zona donde se cruzan los dos círculos. Elige el mayor de ellos.'}},
()=>{const g=R(2,6),[x,y]=cop();return{t:`El m.c.d. de dos números es ${g} y su producto es ${g*x*g*y}. ¿Cuánto vale su m.c.m.?`,a:g*x*y,hh:'Recuerda la relación entre el producto de dos números, su m.c.d. y su m.c.m.'}},
()=>{const g=R(2,9),x=R(2,6),y=R(2,6);return{t:`¿Cuántos divisores comunes tienen ${g*x} y ${g*y}?`,a:divsOf(gcdN(g*x,g*y)).length,hh:'Todos los divisores comunes de dos números son divisores de su m.c.d. Calcula el m.c.d. y cuenta sus divisores.'}},
()=>{const p=P([[4,6],[6,8],[6,9],[4,10],[8,12],[6,10],[9,12]]),M=R(100,250);return{t:`¿Cuántos múltiplos comunes de ${p[0]} y ${p[1]} hay menores que ${M} (sin contar el 0)?`,a:Math.floor((M-1)/lcmN(p[0],p[1])),hh:'Los múltiplos comunes de dos números son los múltiplos de su m.c.m. Averigua cuántos caben antes del límite.'}},
()=>{const Cp=[[8,9],[7,10],[9,16],[11,15],[14,25],[21,22]],Np=[[6,9],[8,12],[10,15],[14,21],[12,18],[20,30]],k=R(1,3),L=sh([...sh(Cp).slice(0,k),...sh(Np).slice(0,4-k)]);return{t:`¿Cuántos de estos pares de números son primos entre sí (su m.c.d. es 1)? ${L.map(x=>'('+x[0]+', '+x[1]+')').join(' ; ')}`,a:k,hh:'Dos números son primos entre sí si no tienen ningún divisor común aparte del 1. Comprueba cada pareja.'}},
()=>{const p=P([[4,6],[6,8],[3,5],[6,9],[4,10],[5,6],[8,12]]),ml=(n)=>Array.from({length:8},(_,i)=>n*(i+1)).join(', ');return{t:`Múltiplos de ${p[0]}: ${ml(p[0])}. Múltiplos de ${p[1]}: ${ml(p[1])}. ¿Cuál es el primer múltiplo que aparece en las dos listas?`,a:lcmN(p[0],p[1]),hh:'Recorre la primera lista de menor a mayor y comprueba si el número aparece también en la segunda.'}},
()=>{const g=R(2,9),[x,y]=cop();return{t:`Para simplificar la fracción ${g*x}/${g*y} hasta que sea irreducible, ¿entre qué número hay que dividir el numerador y el denominador?`,a:g,hh:'Una fracción es irreducible cuando numerador y denominador no tienen divisores comunes. ¿Qué número divide a los dos y es el mayor posible?'}},
()=>{const a=R(4,9),b=a+R(1,5);return{t:`Para sumar 1/${a} + 1/${b} se usa como denominador común el menor posible. ¿Cuál es?`,a:lcmN(a,b),hh:'El denominador común más pequeño es el menor múltiplo que comparten los dos denominadores.'}}]},
{n:'Primos y compuestos',e:'🔐',tip:'Un número primo solo tiene dos divisores: el 1 y él mismo (2, 3, 5, 7, 11…). Un número compuesto tiene más de dos divisores. El 1 no es primo ni compuesto. El único primo par es el 2. Para saber si un número es primo, se prueba a dividirlo entre los primos menores o iguales que su raíz cuadrada. La criba de Eratóstenes tacha los múltiplos de cada primo.',T:[
()=>{const a=R(10,40),b=a+R(10,20);let c=0;for(let i=a;i<=b;i++)if(isPr(i))c++;return{t:`¿Cuántos números primos hay entre ${a} y ${b}, ambos incluidos?`,a:c,hh:'Revisa uno a uno los números del intervalo y descarta los que tengan algún divisor aparte del 1 y de sí mismos. Empieza descartando los pares y los acabados en 5.'}},
()=>{const n=R(20,90);return{t:`¿Cuál es el menor número primo mayor que ${n}?`,a:nxP(n),hh:'Prueba con los números siguientes, uno a uno, y comprueba si tienen algún divisor aparte del 1 y de sí mismos.'}},
()=>{const N=P([30,40,48]);return{t:`En la criba de Eratóstenes de la figura se han tachado el 1 y los múltiplos de 2, 3 y 5 (sin tachar el 2, el 3 ni el 5). ¿Cuántos números quedan sin tachar?`,a:piN(N),g:criba(N),alt:'Criba de Eratóstenes hasta '+N+' con tachados el 1 y los múltiplos de 2, 3 y 5',hh:'Cuenta los números que quedan con color en la figura. Esos números no tienen más divisores que el 1 y ellos mismos.'}},
()=>{const L=[];while(L.length<6){const x=R(4,60);if(!L.includes(x))L.push(x)}return{t:`¿Cuántos de estos números son primos? ${L.join(', ')}`,a:L.filter(isPr).length,hh:'Un número primo solo tiene dos divisores. Descarta los pares (salvo el 2), los acabados en 5 y los múltiplos de 3, y comprueba el resto.'}},
()=>{const Cm=sh([4,6,8,9,10,12,14,15,16,18,21,25,27,33,35]).slice(0,R(1,4)),Pn=sh([2,3,5,7,11,13,17,19,23]).slice(0,R(1,3)),one=R(0,1)?[1]:[],L=sh([...Cm,...Pn,...one]);return{t:`¿Cuántos de estos números son compuestos? ${L.join(', ')}`,a:Cm.length,hh:'Un número compuesto tiene más de dos divisores. Cuidado con el 1: no es primo ni compuesto.'}},
()=>{const N=P([10,20,30,40]);return{t:`¿Cuántos números primos impares hay menores que ${N}?`,a:piN(N-1)-1,hh:'Escribe los primos menores que ese número y quita el único primo que es par.'}},
()=>{const n=R(30,100);return{t:`¿Cuál es el mayor número primo menor que ${n}?`,a:pvP(n),hh:'Ve bajando desde el número anterior y comprueba si cada uno tiene algún divisor aparte del 1 y de sí mismo.'}},
()=>{const p=P([23,29,31,53,61,73,83,89,113]),q=nxP(p);return{t:`Los números primos consecutivos ${p} y ${q} tienen números compuestos entre ellos. ¿Cuántos números compuestos hay entre los dos?`,a:q-p-1,hh:'Entre dos primos consecutivos no hay ningún otro primo, así que todos los números intermedios son compuestos. Cuéntalos.'}},
()=>{const n=R(60,200),r=Math.floor(Math.sqrt(n));return{t:`Para comprobar si ${n} es primo se prueba a dividirlo entre los primos menores o iguales que su raíz cuadrada. ¿Cuál es el mayor primo que hay que probar?`,a:isPr(r)?r:pvP(r),hh:'Calcula aproximadamente la raíz cuadrada del número y busca el mayor primo que no la supere.'}},
()=>{const N=P([10,15,20,25,30]);let s=0;for(let i=2;i<=N;i++)if(isPr(i))s+=i;return{t:`¿Cuánto suman todos los números primos menores o iguales que ${N}?`,a:s,hh:'Escribe los primos hasta ese número y súmalos. Recuerda que el 1 no es primo.'}}]},
{n:'Factores primos',e:'🌳',tip:'Descomponer un número en factores primos es escribirlo como producto de números primos: 60 = 2² · 3 · 5. Se divide entre 2 mientras se pueda, luego entre 3, 5, 7… hasta llegar a 1. El número de divisores es el producto de (exponente + 1) de cada factor. Un número es cuadrado perfecto si todos los exponentes son pares.',T:[
()=>{const e=[R(1,3),R(0,2),R(0,2)],ps=[2,3,5],N=ps.reduce((s,p,i)=>s*p**e[i],1),i=P([0,1,2].filter(x=>e[x]>0));return{t:`${f(N)} = 2<sup>a</sup> · 3<sup>b</sup> · 5<sup>c</sup>. ¿Cuánto vale el exponente del ${ps[i]}?`,a:e[i],hh:'Divide el número entre ese primo todas las veces que puedas y cuenta cuántas veces lo has conseguido.'}},
()=>{const {N}=mkN();return{t:`¿Cuántos factores primos distintos tiene el número ${f(N)}?`,a:Object.keys(facOf(N)).length,hh:'Descompón el número en factores primos y cuenta cuántos primos diferentes aparecen (sin contar las repeticiones).'}},
()=>{const {N}=mkN();return{t:`¿Cuál es el mayor factor primo de ${f(N)}?`,a:Math.max(...Object.keys(facOf(N)).map(Number)),hh:'Descompón el número en factores primos y fíjate en el mayor de los primos que aparecen.'}},
()=>{const p=sh([2,3,5,7]),h=R(0,3),n=p[0]*p[1]*p[2]*p[3];return{t:`El árbol de factores de ${n} termina en cuatro números primos (figura). ¿Qué número primo falta?`,a:p[h],g:arbol(n,p,h),alt:'Árbol de factores de '+n+' con hojas '+p.join(', '),hh:'Cada número del árbol es el producto de los dos que salen de él. Usa los números que ves para averiguar el que falta.'}},
()=>{const a=R(2,4),b=R(1,3),q=P([5,7]);return{t:`Calcula 2<sup>${a}</sup> · 3<sup>${b}</sup> · ${q}.`,a:2**a*3**b*q,hh:'Calcula primero cada potencia y después multiplica los resultados.'}},
()=>{const a=R(1,4),b=R(1,3);return{t:`Si N = 2<sup>${a}</sup> · 3<sup>${b}</sup>, ¿cuántos divisores tiene N?`,a:(a+1)*(b+1),hh:'El número de divisores sale de sumar 1 a cada exponente y multiplicar los resultados.'}},
()=>{const N=P([12,18,20,24,28,45,48,50,72,75,98,108]),o=Object.entries(facOf(N)).filter(([p,e])=>e%2).reduce((s,[p])=>s*p,1);return{t:`¿Cuál es el menor número por el que hay que multiplicar ${N} para obtener un cuadrado perfecto?`,a:o,hh:'Descompón el número en factores primos: un cuadrado perfecto tiene todos los exponentes pares. ¿Qué factores tienen exponente impar?'}},
()=>{const {N}=mkN();return{t:`¿Cuánto suman los factores primos distintos de ${f(N)}?`,a:Object.keys(facOf(N)).map(Number).reduce((x,y)=>x+y,0),hh:'Descompón el número en factores primos y suma cada primo una sola vez, aunque se repita.'}},
()=>{const {N}=mkN();return{t:`En la descomposición en factores primos de ${f(N)}, contando las repeticiones, ¿cuántos factores primos hay en total?`,a:Object.values(facOf(N)).reduce((x,y)=>x+y,0),hh:'Descompón el número y cuenta todos los factores, sumando también las veces que se repite cada primo.'}},
()=>{const a1=R(1,3),b1=R(0,2),a2=R(1,3),b2=R(0,2),m=R(0,1);return{t:`Dados A = 2<sup>${a1}</sup> · 3<sup>${b1}</sup> y B = 2<sup>${a2}</sup> · 3<sup>${b2}</sup>, ¿cuánto vale su ${m?'m.c.m.':'m.c.d.'}?`,a:m?2**Math.max(a1,a2)*3**Math.max(b1,b2):2**Math.min(a1,a2)*3**Math.min(b1,b2),hh:m?'El m.c.m. toma todos los factores, comunes y no comunes, con el mayor exponente. Después calcula el número.':'El m.c.d. toma solo los factores comunes con el menor exponente. Después calcula el número.'}}]},
{n:'Problemas de aplicación',e:'🛒',tip:'Lee el problema y decide qué necesitas: si hay que repartir o dividir en partes iguales lo más grandes posible, usa el m.c.d.; si hay que ver cuándo vuelven a coincidir sucesos que se repiten, usa el m.c.m.; si hay que contar formas de agrupar, piensa en los divisores. Comprueba que la solución tiene sentido en el contexto.',T:[
()=>{const a=R(4,12),b=a+R(1,8);return{t:`Dos faros emiten un destello cada ${a} y cada ${b} segundos. Si acaban de coincidir, ¿cuántos segundos pasarán hasta que vuelvan a coincidir?`,a:lcmN(a,b),hh:'Los destellos coinciden en los múltiplos comunes de los dos tiempos. Busca el menor de ellos.'}},
()=>{const gg=R(2,9),x=R(2,9),y=R(2,9);return{t:`María tiene ${gg*x} lápices y ${gg*y} gomas. Quiere hacer el mayor número posible de lotes iguales sin que sobre nada. ¿Cuántos lotes puede hacer?`,a:gcdN(gg*x,gg*y),hh:'El número de lotes debe dividir a los dos totales a la vez, y tiene que ser lo mayor posible.'}},
()=>{const gg=R(2,9),x=R(2,9),y=R(2,9);return{t:`Un suelo rectangular se cubre con baldosas cuadradas lo más grandes posible, sin cortar ninguna (figura). ¿Cuánto mide el lado de cada baldosa, en dm?`,a:gcdN(gg*x*2,gg*y*2),g:rec((gg*x*2)+' dm',(gg*y*2)+' dm'),alt:'Suelo rectangular de '+(gg*x*2)+' dm por '+(gg*y*2)+' dm',hh:'El lado de la baldosa tiene que caber un número exacto de veces en el largo y en el ancho, y ser lo mayor posible.'}},
()=>{const N=P([12,18,20,24,30,36,40,42,48]);return{t:`En una clase de ${N} alumnos se quieren formar grupos iguales con más de 1 alumno por grupo y con más de 1 grupo, sin que sobre nadie. ¿De cuántas formas distintas se puede hacer?`,a:divsOf(N).length-2,hh:'El tamaño del grupo tiene que dividir al número de alumnos. Cuenta los divisores y descarta los dos casos que no valen.'}},
()=>{const n=R(100,240),pl=P([40,45,50,55]);return{t:`Un colegio organiza una excursión con ${n} alumnos. Cada autobús tiene ${pl} plazas. ¿Cuántos autobuses hacen falta como mínimo?`,a:Math.ceil(n/pl),hh:'Divide los alumnos entre las plazas. Si sobran alumnos, hace falta un autobús más.'}},
()=>{let N;do N=R(30,100);while(N%7==0);return{t:`Un viaje dura ${N} días. Si lo organizamos en semanas completas de 7 días, ¿cuántos días sobran?`,a:N%7,hh:'Divide el número de días entre 7: el resto de la división es lo que sobra.'}},
()=>{const p=P([[12,18],[15,20],[16,24],[18,24],[20,30],[24,36],[10,25]]);return{t:`Dos ruedas dentadas con ${p[0]} y ${p[1]} dientes están engranadas. Si parten de la posición inicial, ¿cuántas vueltas completas da la primera hasta que las dos vuelvan a estar a la vez en la posición inicial?`,a:lcmN(p[0],p[1])/p[0],hh:'Las ruedas vuelven a coincidir cuando han pasado un número de dientes que es múltiplo de los dos. Busca el menor y averigua cuántas vueltas son para la primera.'}},
()=>{const N=P([20,25,30,40]);return{t:`En un equipo los dorsales van del 1 al ${N}. ¿Cuántos jugadores tienen un dorsal que es un número primo?`,a:piN(N),hh:'Escribe los números del 1 al último dorsal y cuenta cuáles son primos. Recuerda que el 1 no lo es.'}},
()=>{const A=P([24,30,36,48,60]);return{t:`Se quiere dibujar un rectángulo de ${A} cm² de área con lados que midan un número entero de cm. ¿Cuántos rectángulos distintos se pueden dibujar? (uno de 3 por 8 es el mismo que uno de 8 por 3)`,a:Math.ceil(divsOf(A).length/2),hh:'El largo y el ancho son dos divisores del área cuyo producto es el área. Cuenta las parejas de divisores sin repetir.'}},
()=>{const gg=R(2,9),[x,y]=cop();return{t:`Se tienen dos cuerdas de ${gg*x} m y de ${gg*y} m. Se cortan en trozos iguales, lo más largos posible, sin que sobre nada. ¿Cuántos trozos salen en total?`,a:x+y,hh:'Primero halla la longitud máxima del trozo (m.c.d.). Después calcula cuántos trozos salen de cada cuerda y súmalos.'}}]}
];
const mkO=q=>{if(q.o)return sh(q.o);const a=q.a;let c;
if(q.fr){const[n,d]=q.fr;c=[[n+1,d],[n,d+1],[n+1,d+1],[d,n],[n-1,d],[n,d-1],[n+2,d],[n,d+2],[2*n,d]].filter(([x,y])=>x>=1&&y>=1&&Math.abs(x/y-a)>1e-9).map(([x,y])=>ft(x,y))}
else if(q.dec){const u=Math.pow(10,-((String(q.s).split(',')[1]||'').length));c=[a+u,a-u,a+10*u,a-10*u,a*10,a/10,a*100,a/100,a+1,a-1,a+2*u,a+100*u].filter(v=>v>=0&&Math.abs(v-a)>1e-9).map(dc)}
else c=[-a,a+1,a-1,a+2,a-2,a+10,a-10,a+3,a+5,a+100,a+7].filter(v=>v!=a).map(String);
return sh([ans(q),...sh([...new Set(c)]).slice(0,3)])};
const O=(q,i)=>`<div class="opts" role="radiogroup" aria-label="Opciones ${i+1}">`+q.o.map(v=>`<label><input type="radio" name="o${i}" value="${v}" ${q.pts!==null||q.bad.includes(v)?'disabled':''}${q.pts!==null&&q.pts>0&&v==ans(q)?' checked':''}>${v}</label>`).join('')+'</div>';
let St,cur=0,mode=null,lc=0;
function gen0(sd){seed=sd;rnd=mul(sd);St=B.map(b=>sh(b.T).slice(0,10).map(fn=>fn()).map((q,i)=>({...q,tries:0,pts:null,msg:'',bad:[],o:[1,3,6,8].includes(i)?mkO(q):null})));
}

function start(){AV=newAv();gen((MR()*4294967296)>>>0);cur=0;mode=null;draw();say(PRES,'cheer')}

const v=document.getElementById('view');
if(cur==B.length)return report(v);
const b=B[cur];
v.innerHTML=`<div class="ban"><span>${b.e}</span><div><small>Bloque ${cur+1} de ${B.length}</small>${b.n}</div></div><details open><summary>💡 Recuerda</summary><p>${b.tip}</p></details>`+St[cur].map((q,i)=>`<div class="card"><div class="q"><div class="t"><b>${i+1}.</b> ${q.t}</div>${q.g?`<div class="gr">${q.g}</div>`:''}
${q.o?O(q,i):`<input id="i${i}" inputmode="text" autocomplete="off" aria-label="Respuesta ${i+1}" ${q.pts!==null?'disabled':''} onkeydown="if(event.key=='Enter')chk(${i})">`}<button class="go" onclick="chk(${i})" ${q.pts!==null?'disabled':''}>Comprobar</button><span class="msg ${q.pts===null?'wrong':'good'}">${q.msg}</span>${hb(q,i)}</div></div>`).join('')+

const pa=r=>{r=String(r).replace(/[−–]/g,'-').replace(/\s+/g,'').replace(',','.');if(/^-?\d+\/-?\d+$/.test(r)){const[n,d]=r.split('/').map(Number);return d?n/d:NaN}return/^-?\d*\.?\d+$/.test(r)?+r:NaN};
