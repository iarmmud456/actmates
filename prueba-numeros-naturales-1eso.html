return VC.find(v=>rx.test(v.name))||VC.find(v=>mine.test(v.name))||VC.find(v=>!other.test(v.name))||VC[0]};
function setVz(n){try{localStorage.setItem(VK,n)}catch(e){}speak(n=='P'?'¡Hola! Soy Chip, y esta es la voz de Pablo.':'¡Hola! Soy Chip, y esta es la voz de Laura.',null)}
try{window.speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function speak(text,btn){const ss=window.speechSynthesis;if(!ss||typeof SpeechSynthesisUtterance=='undefined'){if(btn)btn.textContent='🔇 La voz no está disponible aquí';return}
if(btn&&btn.dataset.on=='1'){ss.cancel();return}
ss.cancel();document.querySelectorAll('[data-on="1"]').forEach(x=>{x.dataset.on='0';x.textContent=x.dataset.t});
const fin=()=>{if(btn){btn.dataset.on='0';btn.textContent=btn.dataset.t}};if(btn){btn.dataset.t=btn.dataset.t||btn.textContent;btn.dataset.on='1';btn.textContent='⏹ Parar'}
const v=pickVoice(),fr=(text.match(/[^.!?…]+[.!?…]*/g)||[text]).map(x=>x.trim()).filter(Boolean).flatMap(x=>x.length>95?(x.match(/[^,;:]+[,;:]?/g)||[x]).reduce((r,p)=>{const l=r[r.length-1];if(l&&l.length+p.length<70)r[r.length-1]=l+p;else r.push(p);return r},[]).map(y=>y.trim()):[x]);
fr.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t);u.lang=v?v.lang:'es-ES';if(v)u.voice=v;const ex=/!\s*$/.test(t),qs=/\?\s*$/.test(t);u.pitch=Math.min(2,(gv()=='P'?1.5:1.8)+MR()*.15+(ex?.1:0)+(qs?.12:0));u.rate=1.1+MR()*.06+(ex?.04:0);u.volume=1;if(i==fr.length-1){u.onend=fin;u.onerror=fin}else u.onerror=fin;ss.speak(u)})}
const stc=q=>q.pts===null?(q.tries?'w':'n'):q.pts>0?(q.tries==1?'a':'b'):'z';
const hs=x=>{let h=0;for(const c of x)h=(h*31+c.charCodeAt(0))%1679616;return h.toString(36)};
const b64=x=>btoa(unescape(encodeURIComponent(x))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64=x=>decodeURIComponent(escape(atob(x.replace(/-/g,'+').replace(/_/g,'/'))));
function mkCode(){const cl=x=>String(x).replace(/[;|]/g,''),p=[seed,cur,cl(document.getElementById('nm').value.trim()),cl(document.getElementById('cs').value.trim()),St.flat().map(q=>(q.hu?'h':'')+stc(q)+(q.ans==null?'':cl(q.ans))).join(';')].join('|');return'N1.'+b64(p)+'.'+hs(p)}
function ldCode(txt){try{const m=txt.trim().replace(/\s+/g,'').match(/^N1\.([\w-]+)\.([0-9a-z]+)$/);if(!m)throw 0;const p=ub64(m[1]);if(hs(p)!==m[2])throw 1;const a=p.split('|'),it=a[4].split(';');if(it.length!=FQ.length)throw 2;gen(+a[0]);let k=0;
St.forEach(b=>b.forEach(q=>{let s=it[k++];if(s[0]=='h'){q.hu=1;s=s.slice(1)}const c=s[0],v=s.slice(1);if(c=='n')return;q.ans=v;q.tries=c=='a'||c=='w'?1:2;if(c=='w'){q.msg='Casi. Repasa el recuadro "Recuerda" e inténtalo otra vez.';if(q.o)q.bad=[typeof q.o[0]=='number'?+v:v]}else{q.pts=c=='a'?pen(1,q):c=='b'?pen(.5,q):0;q.msg=c!='z'?okm(q):'La solución era '+(typeof ans=='function'?ans(q):f(q.a))+'. ¡Fíjate cómo se hace!'}}));
document.getElementById('nm').value=a[2];document.getElementById('cs').value=a[3];cur=Math.min(+a[1],1);mode=null;draw();return''}catch(e){return'Código no válido, incompleto o de otra unidad. Revisa que lo has copiado entero.'}}
const pnl=h=>{document.getElementById('pn').innerHTML=h};
function svOpen(){const c=mkCode();pnl(`<div class="card"><h2>Tu código de progreso</h2><p>Copia este código y guárdalo. Para continuar, abre de nuevo el enlace, pulsa «Continuar con un código» y pégalo.</p><textarea id="cdt" readonly rows="5" style="width:100%">${c}</textarea><p><button class="go" onclick="cpCode()">Copiar código</button> <button class="go" onclick="pnl('')">Cerrar</button> <span class="msg good" id="cpm"></span></p><p class="sub">Longitud del código: ${c.length} caracteres</p></div>`)}
function cpCode(){const t=document.getElementById('cdt'),m=document.getElementById('cpm');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>m.textContent='Copiado.',()=>m.textContent='Selecciona el texto y cópialo a mano.');else m.textContent=ok?'Copiado.':'Selecciona el texto y cópialo a mano.'}
function ldOpen(){pnl(`<div class="card"><h2>Continuar con un código</h2><p>Pega aquí tu código de progreso:</p><textarea id="cdi" rows="4" style="width:100%"></textarea><p><button class="go" onclick="ldGo()">Cargar</button> <button class="go" onclick="pnl('')">Cerrar</button></p><p class="msg wrong" id="ldm" role="status"></p></div>`)}
function ldGo(){const m=ldCode(document.getElementById('cdi').value);if(m)document.getElementById('ldm').textContent=m;else pnl('')}
start();
say(PRES,'cheer');
loadVoices();
</script>
