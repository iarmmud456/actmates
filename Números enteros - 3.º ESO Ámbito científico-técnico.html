const MR=Math.random.bind(Math);let rnd=MR,seed=0;const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const R=(a,b)=>Math.floor(rnd()*(b-a+1))+a,P=a=>a[R(0,a.length-1)],f=n=>n.toLocaleString('es-ES'),S=(b,e)=>`${b}<sup>${e}</sup>`;
const gcd=(a,b)=>b?gcd(b,a%b):a,sh=a=>[...a].sort(()=>rnd()-.5);
const ft=(n,d)=>d==1?''+n:`${n}/${d}`,rd=(n,d)=>{const g=gcd(n,d);return[n/g,d/g]},Q=(t,n,d,r)=>{const[x,y]=rd(n,d);return{t,a:x/y,s:ft(x,y),fr:[x,y],red:r}},ans=q=>q.s!=null?q.s:z(q.a);
const dc=x=>String(+x.toFixed(6)).replace('.',','),Dd=(t,x)=>({t,a:+x.toFixed(6),s:dc(x),dec:1}),fx=(x,k)=>x.toFixed(k).replace('.',','),fs=([n,d])=>`${n}/${d}`,num=x=>+x.replace(',','.');
const rs=()=>{const k=R(1,3);let t='';for(let i=0;i<k;i++)t+=R(0,9);if(t.endsWith('0'))t=t.slice(0,-1)+R(1,9);return t},dl=()=>{const e=R(1,9);let L;do{L=Array.from({length:4},()=>`${e},${rs()}`)}while(new Set(L.map(num)).size<4);return L};
const isEx=d=>{d/=gcd(d,1);while(d%2==0)d/=2;while(d%5==0)d/=5;return d==1};
const z=n=>n<0?'−'+(-n):''+n,nz=(a,b)=>{let x=0;while(!x)x=R(a,b);return x},sg=n=>n<0?'− '+(-n):'+ '+n;
const SV=(w,h,i)=>`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Ilustración" style="max-width:${w}px;width:100%;height:auto">${i}</svg>`;
const pr=n=>n<0?`(${z(n)})`:`${n}`,pm=n=>n<0?`− ${-n}`:`+ ${n}`,n2=()=>P([-1,1])*R(2,9),ud=(n,a,b)=>{const s=new Set();while(s.size<n)s.add(R(a,b));return[...s]},lst=L=>L.map(z).join(' ; ');
const rn=(lo,hi,pts,lab)=>{const n=hi-lo,w=n>16?20:26,x=v=>20+(v-lo)*w,W=40+n*w;let g=`<line x1="8" x2="${W-8}" y1="50" y2="50" style="stroke:var(--ink);stroke-width:2"/>`;
for(let v=lo;v<=hi;v++)g+=`<line x1="${x(v)}" x2="${x(v)}" y1="44" y2="56" style="stroke:var(--ink);stroke-width:2"/>`+(lab.includes(v)?`<text class="gt" x="${x(v)}" y="74" text-anchor="middle">${z(v)}</text>`:'');
pts.forEach(p=>g+=`<circle cx="${x(p.v)}" cy="50" r="6" style="fill:var(--hi);stroke:var(--ink);stroke-width:2"/><text class="gt" x="${x(p.v)}" y="32" text-anchor="middle" style="font-weight:700">${p.l}</text>`);return SV(W,86,g)};
const B=[
{n:'Positivos y negativos',e:'➕',tip:'Los números enteros son los naturales, sus opuestos (negativos) y el 0: …, −3, −2, −1, 0, 1, 2, 3… Los negativos sirven para expresar deudas, temperaturas bajo cero, alturas bajo el nivel del mar o plantas de sótano. El valor absoluto de un número es su distancia al 0 y siempre es positivo: |−5| = |5| = 5. El opuesto de un número tiene el mismo valor absoluto y distinto signo: el opuesto de 4 es −4. El 0 no es ni positivo ni negativo.',T:[
()=>{const k=R(3,60),m=R(2,14),s=R(1,4),[t,v]=P([[`Un submarino navega a ${k} m bajo el nivel del mar. ¿Qué número entero expresa su altitud?`,k],[`El termómetro marca ${m} grados bajo cero. ¿Qué número entero expresa la temperatura?`,m],[`Una persona debe ${k} €. ¿Qué número entero expresa su saldo?`,k],[`Un garaje está en el sótano ${s}; si la planta baja es la 0, ¿qué número entero expresa su planta?`,s]]);return{t,a:-v,hh:'Lo que está por debajo del nivel de referencia (mar, cero grados, planta baja) o lo que se debe se expresa con un número negativo.'}},
()=>{const x=P([-1,1])*R(2,40);return{t:`¿Cuál es el opuesto de ${z(x)}?`,a:-x,hh:'El opuesto está a la misma distancia del 0, pero al otro lado: mismo valor y signo contrario.'}},
()=>{const x=R(2,20),y=R(2,20);return{t:`Calcula |${z(P([-1,1])*x)}| + |${z(P([-1,1])*y)}|.`,a:x+y,hh:'El valor absoluto es la distancia al 0, así que siempre es positivo. Calcula cada uno y súmalos.'}},
()=>{const L=sh([-7,4,-2,0,9,-15,12,-1,6,-20,3,-9]).slice(0,6);return{t:`¿Cuántos de estos números son negativos? ${lst(L)}`,a:L.filter(x=>x<0).length,nn:1,hh:'Un número es negativo si es menor que 0. Fíjate en que el 0 no es negativo ni positivo.'}},
()=>{const n=R(2,40);return{t:`Un número entero negativo tiene valor absoluto ${n}. ¿Qué número es?`,a:-n,hh:'El valor absoluto es el número sin su signo. Si es negativo, ponle el signo menos.'}},
()=>{const n=R(10,90);return{t:`Marcos tiene un saldo de ${z(-n)} € en su cuenta. ¿Cuántos euros debe al banco?`,a:n,hh:'Un saldo negativo significa deuda. La cantidad que se debe es el valor absoluto.'}},
()=>{const pool=[['−7',1],['3/4',0],['0',1],['1,5',0],['12/3',1],['−2,5',0],['9',1],['5/2',0],['−10/5',1],['−4',1]],L=sh(pool).slice(0,6);return{t:`¿Cuántos de estos números son números enteros? ${L.map(x=>x[0]).join(' ; ')}`,a:L.filter(x=>x[1]).length,nn:1,hh:'Un entero no tiene parte decimal ni fraccionaria. Simplifica las fracciones: algunas dan un número entero, como 8/2 = 4.'}},
()=>{const n=R(3,9);return{t:`¿Cuántos números enteros tienen un valor absoluto menor que ${n}?`,a:2*n-1,nn:1,hh:'Piensa en los positivos, en los negativos y en el 0 que cumplen la condición. No olvides el 0.'}},
()=>{const k=R(2,30);return{t:`Calcula −|${z(-k)}|.`,a:-k,hh:'Primero calcula el valor absoluto que está dentro y después aplica el signo menos de fuera.'}},
()=>{const k=R(3,25);return{t:`Una ciudad registra una temperatura de ${z(-k)} °C. ¿Cuántos grados tiene que subir para llegar a 0 °C?`,a:k,nn:1,hh:'Es la distancia desde ese número hasta el 0, es decir, su valor absoluto.'}}]},
{n:'Ordenar y representar',e:'📏',tip:'En la recta numérica los enteros se colocan en orden: los negativos a la izquierda del 0 y los positivos a la derecha. Cuanto más a la derecha está un número, mayor es. Todo positivo es mayor que 0 y que cualquier negativo; entre dos negativos es mayor el que está más cerca del 0 (−2 > −9). Los números simétricos respecto del 0 son opuestos. La distancia entre dos puntos de la recta es la diferencia entre el mayor y el menor.',T:[
()=>{const L=sh([...ud(3,-20,-1),...ud(2,1,20)]);return{t:`¿Cuál es el mayor de estos números? ${lst(L)}`,a:Math.max(...L),hh:'Recuerda: todo positivo es mayor que cualquier negativo. Si solo hay negativos, es mayor el que está más cerca del 0.'}},
()=>{const L=ud(6,-15,15),S=[...L].sort((a,b)=>a-b);return{t:`Si ordenas de menor a mayor estos números, ¿cuál queda en tercer lugar? ${lst(L)}`,a:S[2],hh:'Ordena de menor a mayor empezando por el más negativo, que es el más a la izquierda en la recta.'}},
()=>{const A=nz(-7,7);return{t:'Observa la recta. ¿Qué número entero representa el punto A?',a:A,g:rn(-8,8,[{v:A,l:'A'}],[-8,0,8]),alt:'Recta numérica de −8 a 8 con el punto A en '+A,hh:'Cuenta las marcas desde el 0 (o desde el extremo señalado). A la izquierda del 0 los números son negativos.'}},
()=>{const a=R(2,9),b=R(2,9);return{t:`¿Cuántos números enteros hay entre ${z(-a)} y ${b}, sin contar esos dos?`,a:a+b-1,nn:1,hh:'Cuenta los negativos que hay entre el primero y el 0, el propio 0 y los positivos hasta el segundo, sin incluir los extremos.'}},
()=>{const n=R(3,30),d=R(0,1);return{t:`¿Qué número entero está justo ${d?'después':'antes'} de ${z(-n)}?`,a:d?-n+1:-n-1,hh:'Mira en la recta: el siguiente está una posición a la derecha y el anterior, una a la izquierda.'}},
()=>{const A=-R(2,7),Bv=R(1,7);return{t:'Observa la recta. ¿Cuántas unidades separan el punto A del punto B?',a:Bv-A,nn:1,g:rn(-8,8,[{v:A,l:'A'},{v:Bv,l:'B'}],[-8,0,8]),alt:'Recta numérica con el punto A en '+A+' y el punto B en '+Bv,hh:'La distancia es lo que hay que recorrer de uno al otro. Lee los dos números y calcula la diferencia entre el mayor y el menor.'}},
()=>{const L=[];while(L.length<4){const x=R(-12,12),y=R(-12,12);if(x!=y)L.push([x,y,P(['&lt;','&gt;'])])}return{t:`¿Cuántas de estas desigualdades son verdaderas? ${L.map(q=>z(q[0])+' '+q[2]+' '+z(q[1])).join(' ; ')}`,a:L.filter(q=>q[2]=='&lt;'?q[0]<q[1]:q[0]>q[1]).length,nn:1,hh:'Comprueba cada una colocando mentalmente los dos números en la recta: el de la derecha es el mayor.'}},
()=>{const a=R(3,12);return{t:`¿Qué número entero x cumple ${z(-a)} &lt; x &lt; ${z(-a+2)}?`,a:-a+1,hh:'Busca el único entero que está entre los dos números dados en la recta.'}},
()=>{const A=nz(-8,8);return{t:`El punto A representa el ${z(A)}. ¿Qué número representa el punto simétrico de A respecto del 0?`,a:-A,g:rn(-9,9,[{v:A,l:'A'}],[-9,0,9]),alt:'Recta numérica de −9 a 9 con el punto A en '+A,hh:'El simétrico respecto del 0 está a la misma distancia, al otro lado: es el opuesto.'}},
()=>{let L,S;do{L=ud(5,-15,15);S=L.map(Math.abs).sort((a,b)=>a-b)}while(S[0]==S[1]);return{t:`¿Cuál de estos números está más cerca del 0 en la recta? ${lst(L)}`,a:L.find(x=>Math.abs(x)==S[0]),hh:'La distancia al 0 es el valor absoluto. Busca el que tenga el valor absoluto más pequeño.'}}]},
{n:'Operaciones básicas',e:'✖️',tip:'Suma: con el mismo signo se suman los valores absolutos y se mantiene el signo; con distinto signo se restan y se pone el signo del que tiene mayor valor absoluto. Resta: restar un número es sumar su opuesto: a − (−b) = a + b. Producto y cociente: mismo signo, resultado positivo; distinto signo, negativo (+ · + = +, − · − = +, + · − = −, − · + = −). Un producto con un número par de factores negativos es positivo; con un número impar, negativo.',T:[

()=>{const x=nz(-15,20),y=-R(2,15);return{t:`Calcula ${pr(x)} − ${pr(y)}.`,a:x-y,hh:'Restar un número es sumar su opuesto. Cambia el signo del segundo y suma.'}},
()=>{const [sx,sy]=P([[-1,1],[1,-1],[-1,-1]]),x=R(2,12),y=R(2,12);return{t:`Calcula ${pr(sx*x)} · ${pr(sy*y)}.`,a:sx*x*sy*y,hh:'Multiplica los valores absolutos y decide el signo con la regla: signos iguales, positivo; signos distintos, negativo.'}},
()=>{const dv=n2(),qq=n2();return{t:`Calcula ${pr(dv*qq)} : ${pr(dv)}.`,a:qq,hh:'Divide los valores absolutos y aplica la regla de signos, que es igual que en el producto.'}},
()=>{const a=nz(-15,15),b=nz(-15,15),c=nz(-15,15),d=nz(-15,15);return{t:`Calcula: ${z(a)} ${pm(b)} ${pm(c)} ${pm(d)}.`,a:a+b+c+d,hh:'Suma por separado los términos positivos y los negativos, y después combina los dos resultados.'}},

let lastCur=0,lm='cheer';function resume(){let t=lastCur;if(!St[t].some(q=>q.pts===null))t=St.findIndex(b=>b.some(q=>q.pts===null));if(t<0)return;cur=t;draw();const k=St[t].findIndex(q=>q.pts===null),e=document.getElementById('i'+k)||document.querySelector('input[name=o'+k+']');if(e){e.scrollIntoView({block:'center'});e.focus()}}function hint(i){const q=St[cur][i];if(q.hu||q.pts!==null)return;q.hu=1;const ms=['wink','star','happy','cheer'].filter(x=>x!=lm);q.hm=lm=ms[Math.floor(MR()*ms.length)];hl=q;draw();hl=null;const a=document.getElementById('ava');if(a)a.innerHTML=avSvg(q.hm)}
const hb=(q,i)=>q.hu?`<div class="t hintc"><div class="hav${q===hl?' pop':''}">${avSvg(q.hm||'wink')}</div><div class="bub"><b>Chip te da una pista:</b> ${q.h}<div><button class="go" onclick="speak(St[cur][${i}].h,this)">🔊 Escuchar la pista</button></div></div></div>`:q.pts===null?`<button class="go hb" onclick="hint(${i})">💡 Pedir pista (−0,25 puntos)</button>`:'';
const PRES='¡Hola! Soy Chip, tu ayudante de repaso. Escribe tu nombre y tu curso y empezamos. En cada ejercicio puedes pedirme una pista, y si quieres te la leo en voz alta. Pero ojo: si usas una pista, ese ejercicio tendrá una penalización del 25 % de su valor, es decir, 0,25 puntos menos. Y la respuesta tendrás que encontrarla tú. ¡Mucho ánimo!';
let VC=[],VK='chip_voz2';
const FM=/m[oó]nica|paulina|helena|sabina|laura|elvira|dalia|salome|lola|esperanza|marisol|female|mujer|mar[ií]a|luc[ií]a|elena|ximena|valentina|camila/i,ML=/pablo|diego|jorge|raul|carlos|enrique|alvaro|alonso|jaime|andr[eé]s|gonzalo|tom[aá]s|male|hombre/i;
const vsc=v=>(/natural|neural|online|premium|enhanced|mejorada/i.test(v.name)?40:0)+(/google/i.test(v.name)?20:0)+(/^es-(ES|MX|US)/i.test(v.lang)?3:0)-(/desktop|espeak|compact|novelty/i.test(v.name)?25:0);
const gv=()=>{try{return localStorage.getItem(VK)=='P'?'P':'L'}catch(e){return'L'}};
function loadVoices(){const ss=window.speechSynthesis,sel=document.getElementById('vz');if(ss)VC=((ss.getVoices&&ss.getVoices())||[]).filter(v=>/^es/i.test(v.lang)).sort((a,b)=>vsc(b)-vsc(a));
if(sel){const c=gv();sel.innerHTML=`<option value="L"${c=='L'?' selected':''}>Voz de Laura</option><option value="P"${c=='P'?' selected':''}>Voz de Pablo</option>`}}
const pickVoice=()=>{if(!VC.length)loadVoices();if(!VC.length)return null;const L=gv()=='L',rx=L?/laura/i:/pablo/i,mine=L?FM:ML,other=L?ML:FM;
return VC.find(v=>rx.test(v.name))||VC.find(v=>mine.test(v.name))||VC.find(v=>!other.test(v.name))||VC[0]};
function setVz(n){try{localStorage.setItem(VK,n)}catch(e){}speak(n=='P'?'¡Hola! Soy Chip, y esta es la voz de Pablo.':'¡Hola! Soy Chip, y esta es la voz de Laura.',null)}
try{window.speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function speak(text,btn){const ss=window.speechSynthesis;if(!ss||typeof SpeechSynthesisUtterance=='undefined'){if(btn)btn.textContent='🔇 La voz no está disponible aquí';return}
if(btn&&btn.dataset.on=='1'){ss.cancel();return}
ss.cancel();document.querySelectorAll('[data-on="1"]').forEach(x=>{x.dataset.on='0';x.textContent=x.dataset.t});
const fin=()=>{if(btn){btn.dataset.on='0';btn.textContent=btn.dataset.t}};if(btn){btn.dataset.t=btn.dataset.t||btn.textContent;btn.dataset.on='1';btn.textContent='⏹ Parar'}
const v=pickVoice(),fr=(text.match(/[^.!?…]+[.!?…]*/g)||[text]).map(x=>x.trim()).filter(Boolean).flatMap(x=>x.length>95?(x.match(/[^,;:]+[,;:]?/g)||[x]).reduce((r,p)=>{const l=r[r.length-1];if(l&&l.length+p.length<70)r[r.length-1]=l+p;else r.push(p);return r},[]).map(y=>y.trim()):[x]);
fr.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t);u.lang=v?v.lang:'es-ES';if(v)u.voice=v;const ex=/!\s*$/.test(t),qs=/\?\s*$/.test(t);u.pitch=Math.min(2,(gv()=='P'?1.5:1.8)+MR()*.15+(ex?.1:0)+(qs?.12:0));u.rate=1.1+MR()*.06+(ex?.04:0);u.volume=1;if(i==fr.length-1){u.onend=fin;u.onerror=fin}else u.onerror=fin;ss.speak(u)})}
const stc=q=>q.pts===null?(q.tries?'w':'n'):q.pts>0?(q.tries==1?'a':'b'):'z';
const hs=x=>{let h=0;for(const c of x)h=(h*31+c.charCodeAt(0))%1679616;return h.toString(36)};
const b64=x=>btoa(unescape(encodeURIComponent(x))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64=x=>decodeURIComponent(escape(atob(x.replace(/-/g,'+').replace(/_/g,'/'))));
function mkCode(){const cl=x=>String(x).replace(/[;|]/g,''),p=[seed,cur,cl(document.getElementById('nm').value.trim()),cl(document.getElementById('cs').value.trim()),St.flat().map(q=>(q.hu?'h':'')+stc(q)+(q.ans==null?'':cl(q.ans))).join(';')].join('|');return'E3.'+b64(p)+'.'+hs(p)}
function ldCode(txt){try{const m=txt.trim().replace(/\s+/g,'').match(/^E3\.([\w-]+)\.([0-9a-z]+)$/);if(!m)throw 0;const p=ub64(m[1]);if(hs(p)!==m[2])throw 1;const a=p.split('|'),it=a[4].split(';');if(it.length!=B.length*10)throw 2;gen(+a[0]);let k=0;
St.forEach(b=>b.forEach(q=>{let s=it[k++];if(s[0]=='h'){q.hu=1;s=s.slice(1)}const c=s[0],v=s.slice(1);if(c=='n')return;q.ans=v;q.tries=c=='a'||c=='w'?1:2;if(c=='w'){q.msg='Casi. Repasa el recuadro "Recuerda" e inténtalo otra vez.';if(q.o)q.bad=[typeof q.o[0]=='number'?+v:v]}else{q.pts=c=='a'?pen(1,q):c=='b'?pen(.5,q):0;q.msg=c!='z'?okm(q):'La solución era '+(typeof ans=='function'?ans(q):f(q.a))+'. ¡Fíjate cómo se hace!'}}));
document.getElementById('nm').value=a[2];document.getElementById('cs').value=a[3];cur=Math.min(+a[1],B.length);mode=null;draw();return''}catch(e){return'Código no válido, incompleto o de otra unidad. Revisa que lo has copiado entero.'}}
const pnl=h=>{document.getElementById('pn').innerHTML=h};
function svOpen(){const c=mkCode();pnl(`<div class="card"><h2>Tu código de progreso</h2><p>Copia este código y guárdalo. Para continuar, abre de nuevo el enlace, pulsa «Continuar con un código» y pégalo.</p><textarea id="cdt" readonly rows="5" style="width:100%">${c}</textarea><p><button class="go" onclick="cpCode()">Copiar código</button> <button class="go" onclick="pnl('')">Cerrar</button> <span class="msg good" id="cpm"></span></p><p class="sub">Longitud del código: ${c.length} caracteres</p></div>`)}
function cpCode(){const t=document.getElementById('cdt'),m=document.getElementById('cpm');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>m.textContent='Copiado.',()=>m.textContent='Selecciona el texto y cópialo a mano.');else m.textContent=ok?'Copiado.':'Selecciona el texto y cópialo a mano.'}
function ldOpen(){pnl(`<div class="card"><h2>Continuar con un código</h2><p>Pega aquí tu código de progreso:</p><textarea id="cdi" rows="4" style="width:100%"></textarea><p><button class="go" onclick="ldGo()">Cargar</button> <button class="go" onclick="pnl('')">Cerrar</button></p><p class="msg wrong" id="ldm" role="status"></p></div>`)}
function ldGo(){const m=ldCode(document.getElementById('cdi').value);if(m)document.getElementById('ldm').textContent=m;else pnl('')}
start();
say(PRES,'cheer');
loadVoices();
</script></body></html>
