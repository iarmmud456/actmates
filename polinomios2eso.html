()=>{const a=R(2,6),b=R(2,8),k=R(2,9);return{t:`Un taxi cobra ${b} € de bajada de bandera y ${a} € por kilómetro. Si x son los km, la tarifa es ${b} + ${a}x. ¿Cuánto cuesta un viaje de ${k} km?`,a:b+a*k,hh:'La x representa los kilómetros: sustituye x por el valor y calcula la tarifa.'}},

()=>{const AL=['3x + 2','2a − b','x<sup>2</sup>','4m','7y − 1','a + b + c'],NU=['5 · 4','7 + 9','12 : 3','10 − 6','3<sup>2</sup>','8 + 2 · 5'],k=R(1,4);return{t:`¿Cuántas de estas expresiones son algebraicas? ${sh([...sh(AL).slice(0,k),...sh(NU).slice(0,6-k)]).join(' ; ')}`,a:k,hh:'Una expresión algebraica contiene letras (variables). Si solo hay números, es una expresión numérica.'}},

()=>{const a=R(2,6),b=R(2,6),m=R(2,4),n=R(2,3),g=R(0,1);return{t:`Al dividir (${a*b}x<sup>${m+n}</sup>) : (${a}x<sup>${n}</sup>), ¿cuánto vale ${g?'el exponente de x':'el coeficiente'} del resultado?`,a:g?m:b,hh:g?'Al dividir potencias de la misma letra, los exponentes se restan.':'Al dividir monomios se dividen los coeficientes.'}},
()=>{const a=R(2,5),m=R(2,4),g=R(0,1);return{t:`Al elevar al cuadrado el monomio ${a}x<sup>${m}</sup>, ¿cuánto vale ${g?'el exponente de x':'el coeficiente'} del resultado?`,a:g?2*m:a*a,hh:g?'Al elevar una potencia a otra potencia, los exponentes se multiplican.':'Elevar al cuadrado es multiplicar el monomio por sí mismo: ¿qué pasa con el coeficiente?'}},
()=>{const c=nz(-5,5),k=nz(-3,3);return{t:`Calcula el valor numérico del monomio ${z(c)}x<sup>3</sup> para x = ${z(k)}.`,a:c*k**3,hh:'Sustituye la x por el número, calcula la potencia (cuidado con el signo) y después multiplica por el coeficiente.'}},
()=>{const p=R(1,3),q=R(1,3),r=R(1,3),u=R(1,3);return{t:`¿Qué grado tiene el producto de los monomios x<sup>${p+1}</sup>y<sup>${q}</sup> y 3x<sup>${r}</sup>y<sup>${u+1}</sup>?`,a:p+1+q+r+u+1,hh:'Al multiplicar, se suman los exponentes de cada letra. Después suma los exponentes de todas las letras.'}},
()=>{const c=cf();return{t:`El opuesto del monomio ${z(c)}x<sup>2</sup> es otro monomio con la misma parte literal. ¿Cuánto vale su coeficiente?`,a:-c,hh:'El opuesto de un número es el que tiene el signo contrario.'}},
()=>{const a=R(2,7),b=R(2,7);return{t:`Un rectángulo mide ${a}x de base y ${b}x de altura. Su área es un monomio de la forma ?x<sup>2</sup>. ¿Cuánto vale el número que falta?`,a:a*b,hh:'El área es base por altura. Multiplica los coeficientes y las x entre sí.'}},
()=>{const k=R(1,4),G=['2x<sup>3</sup>','5x<sup>2</sup>y','x<sup>2</sup>y<sup>2</sup>','4x<sup>4</sup>','3xy<sup>2</sup>','7y<sup>3</sup>','x','6x<sup>2</sup>y<sup>2</sup>'],N=['xy','8x<sup>2</sup>','3y','x<sup>2</sup>y<sup>2</sup>','5x<sup>4</sup>','2y<sup>2</sup>'];const g3=['2x<sup>3</sup>','5x<sup>2</sup>y','3xy<sup>2</sup>','7y<sup>3</sup>'],no3=['xy','8x<sup>2</sup>','3y','x<sup>2</sup>y<sup>2</sup>','5x<sup>4</sup>','2y<sup>2</sup>','x'];return{t:`¿Cuántos de estos monomios tienen grado 3? ${sh([...sh(g3).slice(0,k),...sh(no3).slice(0,5-k)]).join(' ; ')}`,a:k,hh:'Calcula el grado de cada monomio sumando los exponentes de sus letras (una letra sin exponente tiene exponente 1).'}},
()=>{const a=R(2,9),b=R(1,8);return{t:`Completa: ${a}x<sup>2</sup> + ?x<sup>2</sup> = ${a+b}x<sup>2</sup>. ¿Cuánto vale el coeficiente que falta?`,a:b,hh:'Al sumar monomios semejantes se suman los coeficientes. ¿Qué número sumado al primero da el total?'}}]},
{n:'Polinomios',e:'📈',tip:'Un polinomio es una suma de monomios con distinto grado. Su grado es el mayor exponente de x (con coeficiente distinto de 0). El coeficiente principal es el del término de mayor grado y el término independiente es el que no lleva x. Para calcular P(k) se sustituye la x por k en todos los términos; P(1) es la suma de todos los coeficientes.',T:[
()=>{const d=R(2,4),ci=rp(d),g=R(0,1);ci[0]=nz(-9,9);return{t:`Dado P(x) = ${pol(ci)}, ¿cuál es su ${g?'grado':'término independiente'}?`,a:g?d:ci[0],hh:g?'El grado de un polinomio es el mayor exponente de x entre los términos que tienen coeficiente distinto de cero.':'El término independiente es el que no lleva x. Fíjate bien en su signo.'}},
()=>{const c=rp(R(2,4)),k=P([-3,-2,-1,2,3]);return{t:`Dado P(x) = ${pol(c)}, ¿cuánto vale P(${z(k)})?`,a:ev(c,k),hh:'Sustituye la x por el número en cada término y calcula respetando la prioridad: potencias, productos y luego sumas y restas.'}},
()=>{const c=rp(R(2,4));return{t:`¿Cuántos términos tiene el polinomio ${pol(c)}?`,a:c.filter(Boolean).length,hh:'Cuenta los monomios que están separados por + o −.'}},
()=>{const dd=R(1,4),L=Array.from({length:4},()=>rp(R(1,4)));return{t:`¿Cuántos de estos polinomios son de grado ${dd}? ${L.map(pol).join(' ; ')}`,a:L.filter(c=>c.length-1==dd).length,hh:'Fíjate solo en el mayor exponente de x de cada polinomio.'}},
()=>{const c=rp(4),w=R(1,3);return{t:`Dado P(x) = ${pol(c)}, ¿cuál es el coeficiente de x${w==1?'':'<sup>'+w+'</sup>'}? (si no aparece ese término, escribe 0)`,a:c[w],hh:'Busca el término con esa potencia de x. Si no está, es que su coeficiente es 0.'}},
()=>{const c=rp(R(2,4));return{t:`¿Cuál es el coeficiente principal del polinomio ${pol(c)}?`,a:c[c.length-1],hh:'El coeficiente principal es el número que acompaña al término de mayor grado.'}},
()=>{const c=rp(R(2,4));return{t:`Dado P(x) = ${pol(c)}, ¿cuánto vale P(1)?`,a:ev(c,1),hh:'Al sustituir x = 1, todas las potencias de x valen 1. ¿Qué queda entonces por sumar?'}},
()=>{const c=rp(4),w=R(1,4);return{t:`Si P(x) = ${pol(c)}, ¿cuál es el coeficiente de x${w==1?'':'<sup>'+w+'</sup>'} en el polinomio opuesto −P(x)? (si no aparece ese término, escribe 0)`,a:-c[w]||0,hh:'El polinomio opuesto se obtiene cambiando el signo de todos los términos.'}},
()=>{const d=R(3,4),c=rp(d);return{t:`Para que P(x) = ${pol(c)} sea un polinomio completo de grado ${d} (con todos los términos desde el grado ${d} hasta el término independiente), ¿cuántos términos le faltan?`,a:d+1-c.filter(Boolean).length,hh:'Un polinomio completo tiene un término de cada grado, desde el mayor hasta el 0. Cuenta cuáles faltan.'}},
()=>{const r1=R(1,4),r2=R(1,7);return{t:`El polinomio P(x) = ${pol([r1*r2,-(r1+r2),1])} vale 0 para algunos valores de x. ¿Para cuántos de los valores x = 1, 2, 3 y 4 vale 0?`,a:(r1<=4?1:0)+(r2<=4&&r2!=r1?1:0),hh:'Sustituye x = 1, 2, 3 y 4 en el polinomio, uno a uno, y comprueba cuáles dan 0.'}}]},
{n:'Operaciones',e:'➕',tip:'Suma: se suman los coeficientes de los términos del mismo grado. Resta: se cambia el signo a todos los términos del segundo polinomio y se suma. Producto: cada término del primero por cada término del segundo, y se agrupan los semejantes (el grado del producto es la suma de los grados). División exacta: busca el polinomio que multiplicado por el divisor da el dividendo.',T:[
()=>{const A=rp(3),Q=rp(3),w=R(0,3);return{t:`Si P(x) = ${pol(A)} y Q(x) = ${pol(Q)}, ¿cuál es ${lab(w)} en P(x) + Q(x)?`,a:A[w]+Q[w],hh:'Para sumar polinomios se suman los coeficientes de los términos del mismo grado. Mira solo el grado que te piden.'}},
()=>{const A=rp(3),Q=rp(3),w=R(0,3);return{t:`Si P(x) = ${pol(A)} y Q(x) = ${pol(Q)}, ¿cuál es ${lab(w)} en P(x) − Q(x)?`,a:A[w]-Q[w],hh:'Al restar, cambia el signo de todos los términos del segundo polinomio y suma los de igual grado. Mira solo el grado que te piden.'}},
()=>{const a=R(1,9),b=R(1,9);return{t:`Desarrolla (x + ${a})(x + ${b}). ¿Cuánto vale el coeficiente de x?`,a:a+b,hh:'Multiplica cada término del primer paréntesis por cada término del segundo y agrupa los términos con x.'}},
()=>{const a=R(2,5),b=R(1,9),c=R(2,5),d=R(1,9);return{t:`Desarrolla (${a}x + ${b})(${c}x + ${d}). ¿Cuánto vale el coeficiente de x?`,a:a*d+b*c,hh:'Multiplica cada término del primer paréntesis por cada término del segundo y agrupa los términos con x.'}},
()=>{const a=R(2,9),b=R(2,9),c=R(1,9),d=R(1,9);return{t:`Desarrolla ${a}x · (${b}x<sup>2</sup> + ${c}x + ${d}). ¿Cuánto vale el coeficiente de x<sup>2</sup>?`,a:a*c,hh:'Multiplica el monomio por cada término del paréntesis: coeficiente por coeficiente y suma los exponentes de x.'}},
()=>{const a=R(1,9),b=R(1,9);return{t:`(x<sup>2</sup> + ${a+b}x + ${a*b}) : (x + ${a}) = x + ?. ¿Cuánto vale el número que falta?`,a:b,hh:'Prueba a multiplicar (x + a) por (x + ?) y comprueba que sale el dividendo. Piensa qué producto y qué suma deben cumplir los números.'}},
()=>{const cancel=R(0,1);let A,Q,l;do{const a=nz(-6,6);A=[nz(-6,6),nz(-6,6),nz(-6,6),a];Q=[nz(-6,6),nz(-6,6),nz(-6,6),cancel?-a:nz(-6,6)];l=A.map((v,i)=>v+Q[i])}while(l[3]!=0&&cancel||(!cancel&&l[3]==0)||(cancel&&l[2]==0));let d=3;while(d>0&&!l[d])d--;return{t:`Si P(x) = ${pol(A)} y Q(x) = ${pol(Q)}, ¿qué grado tiene el polinomio P(x) + Q(x)?`,a:d,hh:'Suma los coeficientes del término de mayor grado: si dan 0, ese término desaparece y el grado baja. Mira cuál es el mayor grado que queda.'}},
()=>{const p=R(1,3),q=R(1,3),A=rp(p),Bq=rp(q);return{t:`¿Qué grado tiene el producto de P(x) = ${pol(A)} y Q(x) = ${pol(Bq)}?`,a:p+q,hh:'Al multiplicar polinomios, los grados se suman.'}},
()=>{const a=R(2,9),b=R(2,9);return{t:`Desarrolla (x + ${a})(x − ${b}). ¿Cuánto vale el término independiente?`,a:-a*b,hh:'El término independiente del producto se obtiene multiplicando los términos independientes de los dos paréntesis. Cuidado con el signo.'}},
()=>{const A=rp(3),m=R(2,5),w=R(0,3);return{t:`Si P(x) = ${pol(A)}, ¿cuál es ${lab(w)} en ${m}·P(x)?`,a:m*A[w],hh:'Multiplicar un polinomio por un número es multiplicar cada coeficiente por ese número.'}},
()=>{const a=R(2,6),b=R(2,6),m=R(2,4);return{t:`(${a*m}x<sup>3</sup> + ${b*m}x<sup>2</sup>) : (${m}x) = ${a}x<sup>2</sup> + ?x. ¿Cuánto vale el número que falta?`,a:b,hh:'Divide cada término del paréntesis entre el monomio: coeficiente entre coeficiente y resta de exponentes.'}}]},
{n:'Productos notables',e:'✨',tip:'Cuadrado de una suma: (a + b)² = a² + 2ab + b². Cuadrado de una diferencia: (a − b)² = a² − 2ab + b². Suma por diferencia: (a + b)(a − b) = a² − b². Sirven para desarrollar rápido, para factorizar y para calcular de cabeza: 31 · 29 = (30 + 1)(30 − 1).',T:[
()=>{const k=R(2,9);return R(0,1)?{t:`Desarrolla (x + ${k})<sup>2</sup>. ¿Cuánto vale el coeficiente de x?`,a:2*k,hh:'El cuadrado de una suma es: cuadrado del primero, más el doble producto del primero por el segundo, más el cuadrado del segundo.'}:{t:`La figura muestra un cuadrado de lado x + ${k} dividido en cuatro partes. ¿Cuánto vale el coeficiente de x en el desarrollo de (x + ${k})<sup>2</sup>?`,a:2*k,g:areaImg(k),alt:'Cuadrado de lado x + '+k+' dividido en un cuadrado x², dos rectángulos x·'+k+' y un cuadrado '+k+'²',hh:'Mira las cuatro partes de la figura: hay un cuadrado de lado x, un cuadrado pequeño y dos rectángulos iguales. ¿Cuáles de ellos tienen x y cuántos hay?'}},
()=>{const k=R(2,9),g=R(0,1);return{t:`Desarrolla (x − ${k})<sup>2</sup>. ¿Cuánto vale ${g?'el término independiente':'el coeficiente de x'}?`,a:g?k*k:-2*k,hh:'El cuadrado de una diferencia es: cuadrado del primero, menos el doble producto, más el cuadrado del segundo.'}},
()=>{const k=R(2,9);return{t:`Desarrolla (x + ${k})(x − ${k}). ¿Cuánto vale el término independiente?`,a:-k*k,hh:'Es una suma por diferencia: es igual al cuadrado del primero menos el cuadrado del segundo.'}},
()=>{const a=P([20,30,40,50]),b=R(1,3);return{t:`Calcula ${a+b}·${a-b} usando una identidad notable.`,a:a*a-b*b,hh:'Escribe los dos números como suma y diferencia de un número redondo y otro pequeño, y aplica suma por diferencia.'}},
()=>{const b=R(1,3),m=R(0,1);return{t:`Calcula ${m?100+b:100-b}<sup>2</sup> usando una identidad notable.`,a:(m?100+b:100-b)**2,hh:'Escribe el número como suma o resta de 100 y otro número pequeño, y aplica el cuadrado de una suma o de una diferencia.'}},
()=>{const k=R(2,9);return{t:`x<sup>2</sup> + ${2*k}x + ${k*k} = (x + ?)<sup>2</sup>. ¿Cuánto vale el número que falta?`,a:k,hh:'Es el desarrollo de un cuadrado de una suma. El término independiente es el cuadrado del segundo número; el del medio es su doble producto con x.'}},
()=>{const k=R(2,12);return{t:`x<sup>2</sup> − ${k*k} = (x + ?)(x − ?). ¿Cuánto vale el número que falta (es el mismo en los dos paréntesis)?`,a:k,hh:'Es una diferencia de cuadrados. ¿Qué número multiplicado por sí mismo da el segundo término?'}},
()=>{const a=R(2,5),b=R(1,6);return{t:`Desarrolla (${a}x + ${b})<sup>2</sup>. ¿Cuánto vale el coeficiente de x?`,a:2*a*b,hh:'Aplica (a + b)² con a = el primer término completo (con su coeficiente) y b = el segundo. El término del medio es el doble producto.'}},
()=>{const a=R(2,9),b=R(2,9);return{t:`Si a + b = ${a+b} y a · b = ${a*b}, ¿cuánto vale a<sup>2</sup> + b<sup>2</sup>?`,a:a*a+b*b,hh:'Desarrolla (a + b)² y despeja a² + b²: te hará falta el doble producto de a por b.'}},
()=>{const a=R(2,9);return{t:`Desarrolla (x + ${a})<sup>2</sup> − (x − ${a})<sup>2</sup>. ¿Cuánto vale el coeficiente de x en el resultado?`,a:4*a,hh:'Desarrolla cada cuadrado por separado y resta (cuidado con el signo del segundo). Fíjate en qué términos se cancelan.'}},
()=>{const k=R(2,5),m=R(2,5),n=R(2,5),w=P(['1','2','3']);const it=[[`(x + ${k})<sup>2</sup> = x<sup>2</sup> + ${2*k}x + ${k*k}`,1],[`(x + ${k})<sup>2</sup> = x<sup>2</sup> + ${k*k}`,0],[`(x − ${m})<sup>2</sup> = x<sup>2</sup> − ${2*m}x + ${m*m}`,1],[`(x − ${m})<sup>2</sup> = x<sup>2</sup> − ${m*m}`,0],[`(x + ${n})(x − ${n}) = x<sup>2</sup> − ${n*n}`,1],[`(x + ${n})(x − ${n}) = x<sup>2</sup> + ${n*n}`,0]];const L=sh([P([it[0],it[1]]),P([it[2],it[3]]),P([it[4],it[5]]),P([it[0],it[1],it[2],it[3],it[4],it[5]]).slice?null:null].filter(Boolean));return{t:`¿Cuántas de estas igualdades son correctas? ${L.map(x=>x[0]).join(' ; ')}`,a:L.reduce((s,x)=>s+x[1],0),hh:'Desarrolla cada producto notable con su fórmula y compara con lo que aparece. Cuidado con el término del medio y con los signos.'}}]},
{n:'Problemas de aplicación',e:'🛒',tip:'Lee el problema y escribe una expresión algebraica con x. Después simplifica (agrupa los términos semejantes) y sustituye x por el valor que te dan; si te dan el resultado, plantea una ecuación y despeja x. Si hay figura, escribe sobre ella lo que mide cada lado. Comprueba que el resultado tiene sentido.',T:[
()=>{const a=R(2,8),k=R(2,6);return{t:`Un jardín rectangular mide x + ${a} m de largo y x m de ancho (figura). ¿Cuántos m² tiene si x = ${k}?`,a:k*(k+a),g:rec('x + '+a+' m','x m'),alt:'Rectángulo de largo x + '+a+' m y ancho x m',hh:'El área de un rectángulo es base por altura. Sustituye x por su valor en cada lado y multiplica.'}},
()=>{const p1=R(2,6),p2=R(1,5),n1=R(2,4),n2=R(2,4),k=R(2,6);return{t:`Una tienda vende camisetas a x + ${p1} € y pantalones a 2x + ${p2} €. Compro ${n1} camisetas y ${n2} pantalones. ¿Cuántos euros pago si x = ${k}?`,a:n1*(k+p1)+n2*(2*k+p2),hh:'Escribe el coste de cada tipo de prenda (cantidad por precio), súmalos y sustituye x por su valor.'}},
()=>{const k=R(2,5),j=R(2,6);return{t:`Un cuadrado de lado x + ${k} dm (figura). ¿Cuántos dm² de área tiene si x = ${j}?`,a:(j+k)**2,g:sqImg('lado = x + '+k+' dm','Área = ?'),alt:'Cuadrado de lado x + '+k+' dm',hh:'El área de un cuadrado es lado por lado. Calcula primero cuánto mide el lado cuando x toma ese valor.'}},
()=>{const c=R(1,9),k=R(2,9);return{t:`Ana tiene x años y su madre 3x + ${c} años. ¿Cuánto suman sus edades si x = ${k}?`,a:4*k+c,hh:'Escribe la suma de las dos edades como una expresión con x, simplifícala y sustituye x.'}},
()=>{const a=R(1,5),b=R(1,3),k=R(3,8);return{t:`Un triángulo tiene lados x + ${a}, 2x y 3x − ${b}. ¿Cuánto mide su perímetro si x = ${k}?`,a:6*k+a-b,hh:'El perímetro es la suma de los tres lados. Agrupa los monomios semejantes y sustituye x por su valor.'}},
()=>{const c=R(1,6),n=R(3,8),k=R(2,6);return{t:`Marta ahorra x € a la semana y su hermano ahorra 2x + ${c} € a la semana. ¿Cuánto ahorran entre los dos en ${n} semanas si x = ${k}?`,a:n*(3*k+c),hh:'Primero suma lo que ahorran los dos en una semana (con x). Después multiplica por el número de semanas y sustituye x.'}},
()=>{const a=R(2,6),b=R(10,30),n=R(3,12);return{t:`Un gimnasio cobra ${b} € de matrícula más ${a} € al mes. Si has pagado en total ${b+a*n} €, ¿cuántos meses has estado apuntado?`,a:n,hh:'Escribe una ecuación con x = número de meses: matrícula más cuota por x es igual al total. Despeja x.'}},
()=>{const k=R(2,5),j=R(2,6);return{t:`Un marco cuadrado tiene lado exterior x + ${k} y el hueco interior es un cuadrado de lado x. ¿Cuántas unidades cuadradas ocupa el marco si x = ${j}?`,a:(j+k)**2-j*j,hh:'El área del marco es el área del cuadrado grande menos la del cuadrado del hueco. Calcula cada una con el valor de x.'}},
()=>{const q=P([[2,3],[3,5],[4,5],[5,6],[6,8]]),s=1+q[0]+q[1];return{t:`Los ángulos de un triángulo miden x, ${q[0]}x y ${q[1]}x grados. ¿Cuánto mide x?`,a:180/s,hh:'Los tres ángulos de un triángulo suman 180°. Suma los monomios semejantes, iguala a 180 y despeja x.'}},
()=>{const k=R(2,5);return{t:`Un cubo tiene arista x dm (figura). ¿Cuántos dm³ de volumen tiene si x = ${k}?`,a:k**3,g:cubeImg('arista = x dm'),alt:'Cubo de arista x dm',hh:'El volumen de un cubo es la arista multiplicada por sí misma tres veces.'}},
()=>{const m=5*R(3,30);return{...Dd(`Una compañía de móvil cobra 5 € fijos más 0,10 € por minuto de llamada. Si x son los minutos, la factura es 5 + 0,1x. ¿Cuántos euros paga quien habla ${m} minutos?`,5+0.1*m),hh:'Sustituye x por los minutos y calcula: primero el producto con 0,1 y después suma la cuota fija.'}}]}
];
const mkO=q=>{if(q.o)return sh(q.o);const a=q.a;let c;
if(q.fr){const[n,d]=q.fr;c=[[n+1,d],[n,d+1],[n+1,d+1],[d,n],[n-1,d],[n,d-1],[n+2,d],[n,d+2],[2*n,d]].filter(([x,y])=>x>=1&&y>=1&&Math.abs(x/y-a)>1e-9).map(([x,y])=>ft(x,y))}
else if(q.dec){const u=Math.pow(10,-((String(q.s).split(',')[1]||'').length));c=[a+u,a-u,a+10*u,a-10*u,a*10,a/10,a*100,a/100,a+1,a-1,a+2*u,a+100*u].filter(v=>v>=0&&Math.abs(v-a)>1e-9).map(dc)}
