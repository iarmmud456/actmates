<p class="sub"><b>Matemáticas · 1.º ESO</b>. 4 bloques, 10 ejercicios en cada uno (4 de ellos para elegir la respuesta correcta). Escribe los números sin separar los miles y los decimales con coma (por ejemplo 2,35). Los números cambian cada vez que empiezas de nuevo.</p>

{n:'Relación de proporcionalidad',e:'⚖️',tip:'Una razón compara dos cantidades mediante su cociente: a/b. Una proporción es la igualdad de dos razones: a/b = c/d, y se cumple a·d = b·c. En dos magnitudes directamente proporcionales, el cociente entre ellas es siempre el mismo: la constante de proporcionalidad.',

return[{t:`${a}/${b} = ${a*k}/x. ¿Cuánto vale x?`,a:b*k},Dd(`${n} kg de naranjas cuestan ${dc(+(n*u).toFixed(2))} €. ¿Cuánto cuesta 1 kg (constante de proporcionalidad)?`,u),{t:`En una tabla de proporcionalidad directa, cuando x = ${x1} se tiene y = ${kk*x1}. ¿Cuánto vale y cuando x = ${x2}?`,a:kk*x2}]}},
{n:'Directa e inversa',e:'🔀',tip:'Directa: si una magnitud se multiplica por 2, la otra también (más kilos, más precio). Inversa: si una se multiplica por 2, la otra se divide entre 2 (más obreros, menos días). Regla de tres directa: producto en cruz. Inversa: el producto de las dos magnitudes es constante.',

g:()=>{const p=P([5,10,15,20,25,30,40,50,60,75]),N=R(10,100)*10,P0=R(10,200),q=P([5,10,15,20,25]),pi=P([10,20,25,50]),I=R(2,10)*20,M=P([20,25,40,50]),c=R(1,M-1);

{n:'Problemas',e:'🧩',tip:'Primero decide si la relación es directa o inversa. Después aplica regla de tres o reducción a la unidad. En los problemas de porcentajes, calcula el factor (1 ± p/100). Una escala 1:200 significa que 1 cm del plano son 200 cm de la realidad.',
g:()=>{const l=R(5,9),k=R(2,20)*50,v=P([20,30,40,50]),m=P([2,3]),qq=R(1,4),N=20*R(3,15),p=P([10,20,25,40,50]),e=P([50,100,200,500]),c=R(2,20);

const O=(q,i)=>`<div class="opts" role="radiogroup" aria-label="Opciones ${i+1}">`+q.o.map(v=>`<label><input type="radio" name="o${i}" value="${v}" ${q.pts!==null||q.bad.includes(v)?'disabled':''}${q.pts!==null&&q.pts>0&&v==ans(q)?' checked':''}>${v}</label>`).join('')+'</div>';
