<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Unidad 2. Divisibilidad - 1.º ESO</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6dc;--card:#fff;--ink:#1d2a5b;--soft:#5a668f;--ok:#1f9e89;--hi:#ffc93c;--bad:#e5533d;--line:#e8dcb5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a36;--card:#1e2650;--ink:#f4f1e6;--soft:#aab3da;--line:#34407a;--ok:#46d1bb}}
:root[data-theme="dark"]{--bg:#141a36;--card:#1e2650;--ink:#f4f1e6;--soft:#aab3da;--line:#34407a;--ok:#46d1bb}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.5 Fredoka,"Trebuchet MS",system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:clamp(26px,6vw,38px);line-height:1.1;margin:0 0 6px;font-weight:600}
.sub{color:var(--soft);margin:0 0 16px}
.name{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
input{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
input:focus,button:focus-visible,summary:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.tabs{display:flex;flex-wrap:wrap;gap:10px;padding:4px 2px 14px}
.tab{flex:0 0 auto;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.tab[aria-selected=true]{background:var(--hi);color:#1d2a5b}
.tab.done{border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
details{background:var(--card);border:2px dashed var(--hi);border-radius:14px;padding:10px 14px;margin-bottom:14px}
summary{cursor:pointer;font-weight:600}
details p{margin:8px 0 0}
.q{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.q input{width:130px}
.q .t{flex:1 1 100%}
button.go{font:inherit;font-weight:600;background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:9px 16px;cursor:pointer}
.msg{font-weight:600}.good{color:var(--ok)}.wrong{color:var(--bad)}
.big{font-size:56px;font-weight:600;line-height:1}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.nav{display:flex;justify-content:space-between;margin-top:8px}
sup{font-size:.7em}
.crit{padding:8px 0;border-bottom:1px solid var(--line)}.crit small{color:var(--soft);display:block}h2{font-size:20px;margin:18px 0 6px}.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--ok)}
.opts{display:flex;flex-wrap:wrap;gap:8px}.opts label{display:flex;gap:6px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:6px 12px;cursor:pointer;background:var(--card)}.q .opts input{width:auto;accent-color:var(--ok)}
@media print{body{background:#fff;color:#000}main>.sub,.tabs,.go,#pm{display:none!important}.card{break-inside:avoid;border-color:#999}main{max-width:none}}
.opts input[type=radio]{width:auto;min-width:0;padding:0;accent-color:var(--ok)}
</style></head><body><main>
<h1>Unidad 2. Divisibilidad</h1>
<p class="sub"><b>Matemáticas · 1.º ESO</b>. 5 bloques, 10 ejercicios en cada uno (4 de ellos para elegir la respuesta correcta). Los números cambian cada vez que empiezas de nuevo.</p>
<div class="name"><label for="nm">Tu nombre:</label><input id="nm" placeholder="Nombre y apellidos" autocomplete="name"><label for="cs">Curso:</label><input id="cs" placeholder="p. ej. 1.º ESO B" size="12"></div>
<div class="tabs" role="tablist" id="tabs"></div>
<div id="view"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,P=a=>a[R(0,a.length-1)],f=n=>n.toLocaleString('es-ES'),S=(b,e)=>`${b}<sup>${e}</sup>`;
const gcd=(a,b)=>b?gcd(b,a%b):a,lcm=(a,b)=>a/gcd(a,b)*b,isP=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i==0)return false;return true},dv=n=>{let c=0;for(let i=1;i<=n;i++)if(n%i==0)c++;return c},sh=a=>[...a].sort(()=>Math.random()-.5);
const B=[
{n:'Múltiplos y divisores',e:'✖️',tip:'Los múltiplos de un número salen al multiplicarlo por 1, 2, 3... Los divisores son los números que lo dividen de forma exacta (resto 0). Todo número tiene como divisores al 1 y a sí mismo.',
g:()=>{const N=P([12,18,20,24,28,30,36,40,42,45,48,60,72]),k=R(3,9),m=k*R(5,12),M=R(60,200),j=R(3,9);
return[{t:`¿Cuántos divisores tiene el número ${N}?`,a:dv(N)},{t:`¿Qué múltiplo de ${k} está entre ${m-k+2} y ${m+k-2}?`,a:m},{t:`¿Cuántos múltiplos de ${j} hay menores o iguales que ${M}? (no cuentes el 0)`,a:Math.floor(M/j)}]}},
{n:'Primos y compuestos',e:'🔐',tip:'Un número primo solo tiene dos divisores: el 1 y él mismo (2, 3, 5, 7, 11...). Un número compuesto tiene más de dos divisores. El 1 no es primo ni compuesto. Para comprobar si es primo, prueba a dividirlo entre los primos menores que su raíz cuadrada.',
g:()=>{const a=R(10,40),b=a+R(10,20),n=R(20,90),l=[];while(l.length<6){const x=R(4,60);if(!l.includes(x))l.push(x)}let c=0,p=n+1;for(let i=a;i<=b;i++)if(isP(i))c++;while(!isP(p))p++;
return[{t:`¿Cuántos números primos hay entre ${a} y ${b}, ambos incluidos?`,a:c},{t:`¿Cuál es el menor número primo mayor que ${n}?`,a:p},{t:`¿Cuántos de estos números son primos? ${l.join(', ')}`,a:l.filter(isP).length}]}},
{n:'Factorización',e:'🌳',tip:'Factorizar es escribir un número como producto de factores primos. Divide entre 2 mientras puedas, luego entre 3, 5, 7... hasta llegar a 1. Ejemplo: 60 = 2² · 3 · 5.',
g:()=>{const e=[R(1,4),R(0,2),R(0,2)],ps=[2,3,5],N=ps.reduce((s,p,i)=>s*p**e[i],1),i=P([0,1,2].filter(x=>e[x]>0)),k=R(1,3),sp=sh([2,3,5,7,11]).slice(0,k),N2=sp.reduce((s,p,j)=>s*(j?p:p*p),1),tp=sh([2,3,5,7,11,13]).slice(0,R(2,3)),N3=tp.reduce((s,p,j)=>s*(j?p:p*p),1);
return[{t:`${f(N)} = 2<sup>a</sup> · 3<sup>b</sup> · 5<sup>c</sup>. ¿Cuánto vale el exponente del ${ps[i]}?`,a:e[i]},{t:`¿Cuántos factores primos distintos tiene el número ${f(N2)}?`,a:k},{t:`¿Cuál es el mayor factor primo de ${f(N3)}?`,a:Math.max(...tp)}]}},
{n:'MCD y MCM',e:'🔗',tip:'El m.c.d. es el mayor divisor común: toma los factores primos comunes con su menor exponente. El m.c.m. es el menor múltiplo común: toma los factores comunes y no comunes con su mayor exponente.',
g:()=>{const g=R(2,12),x=R(2,9),y=R(2,9),z=R(2,9),a=R(4,15),b=a+R(1,8);
return[{t:`Calcula el m.c.d. de ${g*x} y ${g*y}.`,a:gcd(g*x,g*y)},{t:`Calcula el m.c.m. de ${a} y ${b}.`,a:lcm(a,b)},{t:`Calcula el m.c.d. de ${g*x}, ${g*y} y ${g*z}.`,a:gcd(gcd(g*x,g*y),g*z)}]}},
{n:'Problemas',e:'🧩',tip:'Lee el problema y decide: si hay que repartir o dividir en partes iguales lo más grandes posible, usa el m.c.d.; si hay que ver cuándo vuelven a coincidir sucesos que se repiten, usa el m.c.m.',
g:()=>{const a=R(4,12),b=a+R(1,8),g=R(2,9),x=R(2,9),y=R(2,9);
return[{t:`Dos faros emiten un destello cada ${a} y cada ${b} segundos. Si acaban de coincidir, ¿cuántos segundos pasarán hasta que vuelvan a coincidir?`,a:lcm(a,b)},
{t:`María tiene ${g*x} lápices y ${g*y} gomas. Quiere hacer el mayor número posible de lotes iguales sin que sobre nada. ¿Cuántos lotes puede hacer?`,a:gcd(g*x,g*y)},
{t:`Un suelo rectangular mide ${g*x*2} dm de largo y ${g*y*2} dm de ancho. Se cubre con baldosas cuadradas lo más grandes posible, sin cortar ninguna. ¿Cuánto mide el lado de cada baldosa, en dm?`,a:gcd(g*x*2,g*y*2)}]}}
];
const opts=a=>{const c=[...new Set([a+1,a-1,a+2,a-2,a+10,a-10,a+3,a+5,a+100,a+7].filter(v=>v>=0&&v!=a))].sort(()=>Math.random()-.5).slice(0,3);return[a,...c].sort(()=>Math.random()-.5)};
const O=(q,i)=>`<div class="opts" role="radiogroup" aria-label="Opciones ${i+1}">`+q.o.map(v=>`<label><input type="radio" name="o${i}" value="${v}" ${q.pts!==null||q.bad.includes(v)?'disabled':''}${q.pts!==null&&q.pts>0&&v==q.a?' checked':''}>${f(v)}</label>`).join('')+'</div>';
let St,cur=0,mode=null;
function start(){St=B.map(b=>[...b.g(),...b.g(),...b.g(),...b.g()].slice(0,10).map((q,i)=>({...q,tries:0,pts:null,msg:'',bad:[],o:[1,3,6,8].includes(i)?opts(q.a):null})));
cur=0;mode=null;draw()}
function draw(){
document.getElementById('tabs').innerHTML=B.map((b,i)=>`<button class="tab${St[i].every(q=>q.pts!==null)?' done':''}" role="tab" aria-selected="${cur==i}" onclick="cur=${i};draw()">${b.e} ${b.n}</button>`).join('')+`<button class="tab" role="tab" aria-selected="${cur==B.length}" onclick="cur=B.length;draw()">🏆 Mi nota</button>`;
const v=document.getElementById('view');
if(cur==B.length)return report(v);
const b=B[cur];
v.innerHTML=`<details open><summary>💡 Recuerda</summary><p>${b.tip}</p></details>`+St[cur].map((q,i)=>`<div class="card"><div class="q"><div class="t"><b>${i+1}.</b> ${q.t}</div>
${q.o?O(q,i):`<input id="i${i}" inputmode="numeric" aria-label="Respuesta ${i+1}" ${q.pts!==null?'disabled':''} onkeydown="if(event.key=='Enter')chk(${i})">`}<button class="go" onclick="chk(${i})" ${q.pts!==null?'disabled':''}>Comprobar</button><span class="msg ${q.pts===null?'wrong':'good'}">${q.msg}</span></div></div>`).join('')+
`<div class="nav"><button class="go" ${cur==0?'disabled':''} onclick="cur--;draw()">Anterior</button><button class="go" onclick="cur++;draw()">${cur==B.length-1?'Ver mi nota':'Siguiente'}</button></div>`}
function chk(i){const q=St[cur][i];if(q.pts!==null)return;const raw=q.o?((document.querySelector('input[name=o'+i+']:checked')||{}).value||''):document.getElementById('i'+i).value.replace(/[.\s]/g,'').replace(',','.');
if(raw==='')return;const ok=parseFloat(raw)===q.a;q.tries++;q.ans=raw;if(q.o&&!ok)q.bad.push(+raw);
if(ok){q.pts=q.tries==1?1:.5;q.msg=q.tries==1?'¡Correcto! +1':'¡Bien, a la segunda! +0,5'}
else if(q.tries==1)q.msg='Casi. Repasa el recuadro "Recuerda" e inténtalo otra vez.';
else{q.pts=0;q.msg='La solución era '+f(q.a)+'. ¡Fíjate cómo se hace!'}
draw();if(q.pts===null){const e=document.getElementById('i'+i);e&&e.focus()}else for(let k=i+1;k<10;k++){const e=document.getElementById('i'+k);if(e&&!e.disabled){e.focus();break}}}
const C=[{s:'A.4 Relaciones: factores, múltiplos y divisores de un número natural',c:['1.2','1.3']},
{s:'A.4 Relaciones: números primos y compuestos',c:['1.2','1.3']},
{s:'A.4 Relaciones: factorización en números primos',c:['1.2','1.3','2.1']},
{s:'A.4 Relaciones: cálculo del máximo común divisor y del mínimo común múltiplo',c:['1.2','1.3','2.1']},
{s:'A.3 Sentido de las operaciones: resolución de problemas de divisibilidad (m.c.d. y m.c.m.)',c:['1.1','1.2','1.3','2.2']}];
const CR={'1.1':'Iniciarse en la interpretación de problemas matemáticos sencillos, reconociendo los datos, estableciendo relaciones básicas entre ellos y comprendiendo las preguntas formuladas.','1.2':'Aplicar herramientas y estrategias apropiadas que contribuyan a la resolución de problemas.','1.3':'Obtener soluciones matemáticas de un problema, activando los conocimientos necesarios.','2.1':'Comprobar la corrección matemática de las soluciones de un problema.','2.2':'Comprobar la validez de las soluciones de un problema, comprobando su coherencia en el contexto planteado.'};
const cual=n=>n<5?'Insuficiente':n<6?'Suficiente':n<7?'Bien':n<9?'Notable':'Sobresaliente';
const bp=i=>St[i].reduce((s,q)=>s+(q.pts||0),0),fn=x=>x.toFixed(1).replace('.',','),nota=()=>St.flat().reduce((s,q)=>s+(q.pts||0),0)/(B.length*10)*10;
const crit=()=>Object.keys(CR).map(k=>{const bs=C.map((c,i)=>c.c.includes(k)?i:-1).filter(i=>i>=0);return{k,t:CR[k],p:Math.round(bs.reduce((s,i)=>s+bp(i),0)/(10*bs.length)*100)}});
const pl=s=>String(s).replace(/<sup>(.*?)<\/sup>/g,'^$1').replace(/<[^>]+>/g,'').replace(/√/g,'raiz de ').replace(/−/g,'-').replace(/€/g,' euros').replace(/→/g,'->').replace(/[^\x00-\xFF]/g,'');
const det=()=>{const sol=q=>typeof ans=='function'?ans(q):q.a,nm=document.getElementById('nm').value.trim()||'Sin nombre',cs=document.getElementById('cs').value.trim()||'sin indicar';
return`<div class="card" id="det"><h2>Detalle de los ejercicios</h2><p class="sub">Alumno/a: ${nm} · Curso: ${cs} · Fecha: ${new Date().toLocaleDateString('es-ES')}</p>`+B.map((b,i)=>`<p><b>${b.e} ${b.n}</b> (${fn(bp(i))} / 10)</p>`+St[i].map((q,j)=>`<div class="crit"><b>${j+1}.</b> ${q.t}<small>Respuesta: ${q.ans==null?'sin responder':q.ans}${mode=='con'?' · Solución: '+sol(q):''} · Puntos: ${q.pts==null?'-':String(q.pts).replace('.',',')}</small></div>`).join('')).join('')+`</div>`};
function gate(v){v.innerHTML=`<div class="card"><h2>Antes de ver tu nota</h2><p>Elige qué informe quieres generar:</p>
<div class="opts" role="radiogroup" aria-label="Tipo de informe" style="flex-direction:column;align-items:stretch"><label><input type="radio" name="md" value="sin"> Informe con resultados, sin soluciones</label>
<label><input type="radio" name="md" value="con"> Informe con resultados y con soluciones (hace falta el código)</label></div>
<p><label for="cd">Código (solo para el informe con soluciones):</label> <input id="cd" type="password" autocomplete="off" size="14"></p>
<p><button class="go" onclick="setMode()">Ver mi nota y generar el informe</button></p><p class="msg wrong" id="gm" role="status"></p></div>`}
function setMode(){const m=(document.querySelector('input[name=md]:checked')||{}).value,g=document.getElementById('gm');
if(!m){g.textContent='Elige una de las dos opciones.';return}
if(m=='con'&&document.getElementById('cd').value.trim().toLowerCase()!='revelar'){g.textContent='Código incorrecto.';return}
mode=m;draw()}
function report(v){if(!mode)return gate(v);const n=nota(),pend=St.flat().filter(q=>q.pts===null).length,nm=document.getElementById('nm').value.trim()||'Sin nombre';
v.innerHTML=`<div class="card"><p class="sub">Informe de ${nm}${document.getElementById('cs').value.trim()?' · '+document.getElementById('cs').value.trim():''}</p><div class="big">${fn(n)}<span style="font-size:24px"> / 10</span></div><p><b>${cual(n)}</b>${pend?` · Te quedan ${pend} ejercicios sin responder.`:''}</p>
<h2>Saberes básicos</h2>`+B.map((b,i)=>`<div class="crit"><div class="row" style="border:0;padding:0"><span>${b.e} ${b.n}</span><b>${fn(bp(i))} / 10</b></div><small>${C[i].s}</small></div>`).join('')+
`<h2>Criterios de evaluación</h2>`+crit().map(c=>`<div class="crit"><div class="row" style="border:0;padding:0"><span><b>${c.k}</b></span><b>${c.p} %</b></div><small>${c.t}</small><div class="bar"><i style="width:${c.p}%"></i></div></div>`).join('')+
`<p><button class="go" onclick="makePdf()">Descargar informe en PDF</button> <button class="go" onclick="prn()">Imprimir / guardar como PDF</button> <button class="go" onclick="mode=null;draw()">Cambiar tipo de informe</button> <button class="go" style="background:var(--hi);color:#1d2a5b" onclick="start()">Empezar de nuevo</button></p><p class="msg" id="pm" role="status"></p></div>`+det()}
function buildPdf(){
const nm=document.getElementById('nm').value.trim()||'Sin nombre',n=nota(),d=new window.jspdf.jsPDF({unit:'mm',format:'a4'});let y=18;
const T=(t,o={})=>{d.setFont('helvetica',o.b?'bold':'normal');d.setFontSize(o.s||10);d.splitTextToSize(pl(t),o.w||180).forEach(l=>{if(y>280){d.addPage();y=18}d.text(l,o.x||15,y);y+=(o.s||10)*.45});y+=o.g==null?1.5:o.g};
T('Informe de evaluación'+(mode=='con'?' (con soluciones)':''),{b:1,s:18,g:2});T('Unidad 2. Divisibilidad · Matemáticas · 1.º ESO',{b:1,s:12});
T('Alumno/a: '+nm+'     Curso: '+(document.getElementById('cs').value.trim()||'sin indicar')+'     Fecha: '+new Date().toLocaleDateString('es-ES'));
T('Calificación: '+fn(n)+' / 10 ('+cual(n)+')',{b:1,s:14,g:3});
T('Calificación = puntos obtenidos (50 máx.) / 50 x 10. Acierto a la primera: 1 punto; a la segunda: 0,5; fallo: 0.',{s:8,g:4});
T('Saberes básicos trabajados',{b:1,s:13});B.forEach((b,i)=>{T(b.n+': '+fn(bp(i))+' / 10',{b:1});T(C[i].s+'. Criterios: '+C[i].c.join(', '),{s:9,x:20,w:175,g:2.5})});
y+=2;T('Criterios de evaluación (grado de logro)',{b:1,s:13});crit().forEach(c=>{T(c.k+' ('+c.p+' %)',{b:1});T(c.t,{s:9,x:20,w:175,g:2.5})});
y+=2;T('Detalle de los ejercicios',{b:1,s:13});
B.forEach((b,i)=>{T(b.n,{b:1,g:1});St[i].forEach((q,j)=>{T((j+1)+'. '+q.t,{x:18,w:177,g:.5});T('Respuesta: '+(q.ans==null?'sin responder':q.ans)+(mode=='con'?'   Solución: '+q.a:'')+'   Puntos: '+(q.pts==null?'-':String(q.pts).replace('.',',')),{s:9,x:22,g:2.5})})});
y+=4;T('Referencia curricular: Real Decreto 217/2022 (LOMLOE) y Orden de 30 de mayo de 2023 por la que se desarrolla el currículo de ESO en Andalucía (Matemáticas, 1.º ESO).',{s:8});
return d}
const fname=()=>'informe-unidad2-'+(document.getElementById('nm').value.trim()||'Sin nombre').replace(/[^\wáéíóúñÁÉÍÓÚÑ ]/g,'').trim().replace(/\s+/g,'-')+'.pdf';
const prn=()=>{try{window.print()}catch(e){document.getElementById('pm').textContent='No se puede imprimir desde esta vista. Usa la opción de imprimir de tu navegador.'}};
async function makePdf(){const pm=document.getElementById('pm');pm.textContent='Preparando el informe...';let d;
try{d=buildPdf()}catch(e){pm.textContent='No se ha podido crear el PDF en esta vista. Usa "Imprimir / guardar como PDF" o consulta el detalle de abajo.';return}
const fn2=fname();
try{const D=window.claude&&claude.use?await claude.use('downloads'):null;if(D){await D.save({filename:fn2,data:d.output('arraybuffer')});pm.textContent='Informe listo.';return}}catch(e){if(e&&e.code=='declined'){pm.textContent='Descarga cancelada.';return}}
try{const u=URL.createObjectURL(d.output('blob')),a=document.createElement('a');a.href=u;a.download=fn2;document.body.appendChild(a);a.click();a.remove();pm.innerHTML='Si el PDF no se ha descargado, <a href="'+u+'" target="_blank" rel="noopener">ábrelo aquí</a> o usa "Imprimir / guardar como PDF".'}catch(e){pm.textContent='Usa "Imprimir / guardar como PDF" para guardar el informe.'}}
start();
</script></body></html>
